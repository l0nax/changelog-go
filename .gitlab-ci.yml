variables:
  GO_IMAGE: golang:1.27
  GOLANGCI_LINT_VERSION: v2.13.2
  GOTOOLCHAIN: local
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

default:
  image: $GO_IMAGE
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod
      - .cache/go-build

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

stages:
  - test
  - build
  - release

build:
  stage: test
  script:
    - go build ./...

test:
  stage: test
  variables:
    # -race needs cgo, which the golang image has but which is worth pinning
    # so the failure mode is never a confusing "-race requires cgo"
    CGO_ENABLED: "1"
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week
    when: always

lint:
  stage: test
  # Pinned: the config uses the golangci-lint v2 schema, which v1 cannot read,
  # and a linter that floats breaks the pipeline on somebody else's release.
  image: golangci/golangci-lint:$GOLANGCI_LINT_VERSION
  script:
    - golangci-lint run ./...

# The feature this project exists for: every merge request has to carry a
# changelog entry. A release branch, which regenerates CHANGELOG.md instead of
# adding an entry, is skipped by the command itself.
changelog:
  stage: test
  variables:
    # the check diffs against the target branch, which a shallow clone may not
    # have fetched
    GIT_DEPTH: 0
  script:
    - go run . validate
    - go run . check --compare-with "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

goreleaser:
  stage: build
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  variables:
    # goreleaser diffs between tags, and the build stamps the version from the
    # VCS state, so the full history has to be there
    GIT_DEPTH: 0
  script:
    - goreleaser release --snapshot --clean
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: release
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG
