variables:
  GO_IMAGE: golang:1.27
  GOLANGCI_LINT_VERSION: v2.13.2
  # Pinned for the same reason as the linter: "latest" turned the brews ->
  # homebrew_casks deprecation into something that would break a release
  # without warning.
  GORELEASER_VERSION: v2.18.2
  GOTOOLCHAIN: local
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

default:
  image: $GO_IMAGE
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod
      - .cache/go-build

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

# Merge request pipelines, without the duplicate branch pipeline alongside
# them. A branch with no open MR still gets a pipeline of its own.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# A job with no rules of its own defaults to "branches and tags", which leaves
# it out of merge request pipelines entirely. Everything that has to run on an
# MR therefore has to say so.
.always: &always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release

build:
  <<: *always
  stage: test
  script:
    - go build ./...

test:
  <<: *always
  stage: test
  variables:
    # -race needs cgo, which the golang image has but which is worth pinning
    # so the failure mode is never a confusing "-race requires cgo"
    CGO_ENABLED: "1"
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week
    when: always

lint:
  <<: *always
  stage: test
  # Pinned: the config uses the golangci-lint v2 schema, which v1 cannot read,
  # and a linter that floats breaks the pipeline on somebody else's release.
  image: golangci/golangci-lint:$GOLANGCI_LINT_VERSION
  script:
    - golangci-lint run ./...

# The feature this project exists for: every merge request has to carry a
# changelog entry. A release branch, which regenerates CHANGELOG.md instead of
# adding an entry, is skipped by the command itself.
changelog:
  stage: test
  variables:
    # the check diffs against the target branch, which a shallow clone may not
    # have fetched
    GIT_DEPTH: 0
  script:
    - go run . validate
    - go run . check --compare-with "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

goreleaser:
  stage: build
  image:
    name: goreleaser/goreleaser:$GORELEASER_VERSION
    entrypoint: [""]
  variables:
    # goreleaser diffs between tags, and the build stamps the version from the
    # VCS state, so the full history has to be there
    GIT_DEPTH: 0
  script:
    - goreleaser release --snapshot --clean
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: release
  image:
    name: goreleaser/goreleaser:$GORELEASER_VERSION
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
    # The pipeline's own token is enough to create the release; goreleaser is
    # told to treat it as one via gitlab_urls.use_job_token. No personal or
    # project token has to be configured anywhere.
    #
    # The Homebrew formula is NOT published from here -- CI_JOB_TOKEN has no
    # project API access -- so .goreleaser.yaml sets skip_upload and the
    # formula is committed by hand. It is in the dist/ artifact below.
    GITLAB_TOKEN: $CI_JOB_TOKEN
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  script:
    # The release notes are this project's own changelog entries for the tag,
    # not a dump of the commit log. --no-heading because the release page
    # already carries the version and date as its title.
    - go run . show --no-heading "$CI_COMMIT_TAG" > release-notes.md
    - goreleaser release --clean --release-notes=release-notes.md
  rules:
    - if: $CI_COMMIT_TAG
