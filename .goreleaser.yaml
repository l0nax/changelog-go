# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

# The command is "changelog", as it was in v1. The repository and the Go module
# are still changelog-go; only the binary, the archives and the formula use the
# short name, so that scripts written against v1 keep working.
project_name: changelog

before:
  hooks:
    - go mod tidy

builds:
  - id: "default"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

    # No -X stamps: the toolchain records the version, commit and dirtiness in
    # the build info by itself, and internal/version reads them back. Set
    # explicitly so that GoReleaser does not fall back to its default
    # "-X main.version=..." flags, which this binary has nowhere to put.
    #
    # Stripping is safe here: the build info lives in its own section and
    # survives -s -w.
    ldflags:
      - -s
      - -w

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

    # use zip for windows archives
    format_overrides:
      - goos: windows
        format: zip

# The notes come from this tool's own changelog, not from the commit log:
# CI writes them with "changelog show" and passes --release-notes.
changelog:
  disable: true

brews:
  - name: changelog

    # v1 served the tap out of this repository, with the formula at its root:
    #   brew tap l0nax/changelog-go https://gitlab.com/l0nax/changelog-go
    #
    # Pushing here needs a token with write access to the repository.
    repository:
      owner: l0nax
      name: changelog-go

    homepage: "https://gitlab.com/l0nax/changelog-go"
    description: "Keep a changelog without merge conflicts, one entry file per change"
    license: "MIT"

    dependencies:
      - name: git

    # A pre-release must not become what "brew install" hands everybody. With
    # "auto" the formula is only published for a final release.
    skip_upload: auto

    install: |
      bin.install "changelog"

    test: |
      system "#{bin}/changelog", "version"

release:
  gitlab:
    owner: l0nax
    name: changelog-go

  ids:
    - default

  name_template: "v{{.Version}}"

  disable: false

  # Mark a release built from a pre-release tag as such, instead of presenting
  # an rc as the current version.
  prerelease: auto

  # What to do with the release notes in case there the release already exists.
  #
  # Valid options are:
  # - `keep-existing`: keep the existing notes
  # - `append`: append the current release notes to the existing notes
  # - `prepend`: prepend the current release notes to the existing notes
  # - `replace`: replace existing notes
  #
  # Default: 'keep-existing'.
  mode: keep-existing
