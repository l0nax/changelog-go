# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

# The command is "changelog", as it was in v1. The repository and the Go module
# are still changelog-go; only the binary, the archives and the formula use the
# short name, so that scripts written against v1 keep working.
project_name: changelog

before:
  hooks:
    - go mod tidy

builds:
  - id: "default"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

    # No -X stamps: the toolchain records the version, commit and dirtiness in
    # the build info by itself, and internal/version reads them back. Set
    # explicitly so that GoReleaser does not fall back to its default
    # "-X main.version=..." flags, which this binary has nowhere to put.
    #
    # Stripping is safe here: the build info lives in its own section and
    # survives -s -w.
    ldflags:
      - -s
      - -w

# Semver build metadata ("+1") is dropped from every artifact name. GitLab
# rejects a release asset filepath containing "+" ("Filepath is in an invalid
# format"), and in a URL "+" means a space anyway. Build metadata is ignored for
# version precedence, so nothing is lost by leaving it out of the filename.
checksum:
  name_template: "{{ .ProjectName }}_{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ with .Prerelease }}-{{ . }}{{ end }}_checksums.txt"

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: "{{ .ProjectName }}_{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ with .Prerelease }}-{{ . }}{{ end }}_{{ .Os }}_{{ .Arch }}"

    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

    # Listed explicitly. The default globs include "changelog*", which also
    # matches a "changelog-go" binary left in the working tree by "make
    # build-dev" -- that got an 8 MB stale binary bundled into every archive.
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - MIGRATION.md

# The notes come from this tool's own changelog, not from the commit log:
# CI writes them with "changelog show" and passes --release-notes.
changelog:
  disable: true

# The release is created with the pipeline's own CI_JOB_TOKEN, so no personal
# or project token has to exist. The job sets GITLAB_TOKEN to it.
gitlab_urls:
  use_job_token: true

# "brews" is deprecated -- soft since GoReleaser v2.10, hard since v2.16 -- in
# favour of casks, which install the pre-compiled binary properly instead of
# through a synthesised formula.
homebrew_casks:
  - name: changelog

    # The tap is this repository:
    #   brew tap l0nax/changelog-go https://gitlab.com/l0nax/changelog-go
    repository:
      owner: l0nax
      name: changelog-go

    homepage: "https://gitlab.com/l0nax/changelog-go"
    description: "Keep a changelog without merge conflicts, one entry file per change"
    license: "MIT"

    binaries: [changelog]

    dependencies:
      - formula: git

    # Published by hand; see RELEASING.md. The cask pins the version and the
    # archive checksums, so it is wrong until that happens -- which is how the
    # v1 formula sat at 1.4.1 for three years.
    skip_upload: true

    hooks:
      post:
        # The binaries are not signed or notarized, so macOS quarantines them
        # and reports the download as damaged. Stripping the attribute is what
        # GoReleaser documents for unsigned casks; it does step around
        # Gatekeeper, and Apple may close it off at some point. Signing and
        # notarizing is the real fix, if it ever becomes worth the Developer ID.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/changelog"]
          end

release:
  gitlab:
    owner: l0nax
    name: changelog-go

  ids:
    - default

  name_template: "v{{.Version}}"

  disable: false

  # Mark a release built from a pre-release tag as such, instead of presenting
  # an rc as the current version.
  prerelease: auto

  # What to do with the release notes in case there the release already exists.
  #
  # Valid options are:
  # - `keep-existing`: keep the existing notes
  # - `append`: append the current release notes to the existing notes
  # - `prepend`: prepend the current release notes to the existing notes
  # - `replace`: replace existing notes
  #
  # Default: 'keep-existing'.
  mode: keep-existing
