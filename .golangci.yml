version: "2"

run:
  modules-download-mode: readonly
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - rowserrcheck
    - unconvert
    - wsl_v5

  settings:
    depguard:
      rules:
        deprecated:
          deny:
            - pkg: io/ioutil
              desc: use the os and io packages instead
            - pkg: github.com/BurntSushi/toml
              desc: use github.com/pelletier/go-toml/v2
            - pkg: gitlab.com/fabmation-gmbh/toml
              desc: deprecated and archived, use github.com/pelletier/go-toml/v2

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - octalLiteral
        - commentFormatting
        - hugeParam
        - unnamedResult

    gocyclo:
      min-complexity: 20

    gosec:
      excludes:
        # The config file is meant to be world-readable; 0644 is correct.
        - G306
        # This is a CLI: the only thing it logs is its own error text.
        - G706

    govet:
      enable-all: true
      disable:
        - fieldalignment
        # Flags idiomatic "if err := f(); err != nil" inside a function that
        # already has an err. Off by default in golangci-lint for that reason.
        - shadow

    misspell:
      locale: US

    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test helpers and table-driven tests read better without these.
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
          - wsl_v5

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - gitlab.com/l0nax/changelog-go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
